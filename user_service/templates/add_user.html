{% extends "base.html" %}
{% block content %}
<h2>Add user</h2>
<form method="post">
  <label for="name">Name</label>
  <input type="text" name="name" id="name" required value="{{ request.form.get('name', '') }}">

  <label for="id">Id</label>
  <input type="text" name="id" id="id" value="{{ request.form.get('id', '') }}">

  <label for="student_number">Student number</label>
  <input type="text" name="student_number" id="student_number" value="{{ request.form.get('student_number', '') }}">

  <label for="password">Password</label>
  <input type="password" name="password" id="password" required>

  <label for="role">Role</label>
  <select name="role" id="role" required>
    {% for r in roles %}
    <option value="{{ r }}" {% if r==request.form.get('role') %}selected{% endif %}>{{ r }}</option>
    {% endfor %}
  </select>

  <p><button type="submit">Add user</button></p>
</form>
{% endblock %}
