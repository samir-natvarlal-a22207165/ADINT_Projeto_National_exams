{% extends "base.html" %}
{% block content %}
<h2>Correct answer {{ c.id }}</h2>
<p>Exam {{ c.exam_label }} &middot; question {{ c.question_number }}
&middot; assigned professor: {{ owner if owner else 'unassigned' }}</p>

<form method="post">
  <label for="grade">Grade</label>
  <input type="text" name="grade" id="grade" required value="{{ c.grade if c.grade is not none else '' }}">
  <button type="submit">Save grade</button>
  <a href="{{ url_for('list_assigned') }}">Back to list</a>
</form>

<img class="page" src="{{ url_for('correction_image', correction_id=c.id) }}" alt="Scanned answer">
{% endblock %}
