{% extends "base.html" %}
{% block content %}
<h2>Exam {{ job.exam_id }} - {{ job.course }} ({{ job.date }})</h2>
<table>
  <thead><tr><th>Sheet (QR code)</th><th>Position in PDF</th></tr></thead>
  <tbody>
  {% for s in job.sheets %}
    <tr><td>{{ s.id }}</td><td>{{ s.sheet_number }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
